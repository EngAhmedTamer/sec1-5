{q:['«ممنوع التعديل على العمل» ترخيص:','"No modifications allowed" is license:'],o:[['ND','ND'],['SA','SA']],a:0}];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let stk=0,tries={},cs=0,ca,cn=0;
const LV=[['مبتدئ','Beginner'],['فاهم','Learner'],['محترف','Pro'],['خبير','Expert']];
function hud(){const l=Math.min(3,xp/60|0);$('#xp').innerHTML='⭐ '+xp+' <span class="lv">'+t(LV[l])+'</span>'+(stk>1?' <span class="stk">🔥'+stk+'</span>':'')}
function save(){try{localStorage.setItem('u2p',JSON.stringify({xp,done,miss}))}catch(e){}}
function reward(ok){let b=0;if(ok){stk++;b=Math.min(stk-1,5)*2;xp+=10+b}else stk=0;hud();save();return b}
const QX=[['البصمة بيانات حيوية = حساسة، وليها حماية أكبر من الاسم والعنوان.','Biometrics are sensitive data with extra protection.'],['Opt-in يعني تسمح الأول، وبعدين يجمعوا بياناتك.','Opt-in = you agree first, then data is collected.'],['الصورة حق لصاحبها — لازم إذنه قبل النشر.','A photo belongs to its owner — ask before posting.'],['حقوق المؤلف: عمره + 50 سنة. الـ10 سنين دي للعلامة التجارية.','Copyright: life + 50 years. The 10 years is for trademarks.'],['حقوق المؤلف تلقائية من لحظة الإنشاء بدون تسجيل.','Copyright is automatic at creation, no registration.'],['ND = ممنوع التعديل. أما SA فمعناها نفس الترخيص.','ND = no changes. SA means same license.']];
const CS=[
{ic:'📸',q:['سارة نشرت صورة صاحبتها في جروب المدرسة من غير ما تسألها.','Sara posted her friend\'s photo in the class group without asking.'],o:AV,a:1,x:['حتى لو الصورة عادية، لازم إذن صاحبها قبل النشر — ده حق الصورة.','Even an ordinary photo needs its owner\'s consent — that is image rights.']},
{ic:'📩',q:['موقع بيبعتلك عروض كل يوم، ولو مش عايز لازم تدوس «إلغاء الاشتراك».','A site emails you offers daily; to stop, you must click "Unsubscribe".'],o:[['Opt-in','Opt-in'],['Opt-out','Opt-out']],a:1,x:['Opt-out: بيستخدم بياناتك لحد ما تعترض. الـ Opt-in بيسألك قبل.','Opt-out: they use your data until you object. Opt-in asks first.']},
{ic:'🧬',q:['تطبيق عايز يجمع بصمتك وحالتك الصحية. نوع البيانات دي؟','An app wants your fingerprint and health record. What kind of data?'],o:[['أساسية','Basic'],['حساسة','Sensitive']],a:1,x:['الصحة والبصمة = بيانات حساسة، وليها حماية قانونية أكبر.','Health & biometrics are sensitive data with stronger legal protection.']},
{ic:'📖',q:['طالب نقل فقرة طويلة من كتاب في بحثه من غير « » ولا مصدر.','A student copied a long passage into his report with no « » and no source.'],o:[['اقتباس سليم','Valid quotation'],['انتهاك','Violation']],a:1,x:['الاقتباس السليم = جزء صغير + « » + ذكر المصدر + بدون تعديل.','Valid quotation = small part + « » + source + unchanged.']},
{ic:'🏫',q:['مدرس صوّر صفحتين من كتاب علشان يشرح بيهم الدرس في الفصل.','A teacher photocopied two pages to teach the lesson in class.'],o:AV,a:0,x:['ده من الاستثناءات: النسخ لأغراض التدريس مسموح بدون إذن.','An exception: copying for teaching is allowed without permission.']},
{ic:'💼',q:['صورة عليها ترخيص CC BY-NC، ومصمم حطها في إعلان بيع لمحله.','A photo is licensed CC BY-NC and a designer used it in his shop\'s sales ad.'],o:AV,a:1,x:['NC = غير تجاري، وإعلان البيع استخدام تجاري.','NC = non-commercial; a sales ad is commercial use.']},
{ic:'✍️',q:['كتبت قصة امبارح ومسجلتهاش في أي جهة. هل هي محمية؟','You wrote a story yesterday and registered it nowhere. Is it protected?'],o:YN,a:0,x:['حقوق المؤلف بتبدأ تلقائياً من لحظة الإنشاء.','Copyright starts automatically at creation.']},
{ic:'⏳',q:['مؤلف مات من 26 سنة. هل أعماله لسه محمية؟','An author died 26 years ago. Are his works still protected?'],o:YN,a:0,x:['الحماية = عمر المؤلف + 50 سنة، فلسه فاضل 24 سنة.','Protection = life + 50 years, so 24 years remain.']}];
function setLang(){lang=lang==='ar'?'en':'ar';try{localStorage.setItem('u2l',lang)}catch(e){}render()}
function unlock(){if($('#gi').value==='546362'){$('#gate').style.display='none';$('#app').style.display='block';try{sessionStorage.setItem('u2k','1')}catch(e){}render()}else{$('#ge').textContent=s('bad');$('.gc').classList.add('shake')}}
$('#gi').addEventListener('keydown',e=>e.key==='Enter'&&unlock());
try{if(sessionStorage.getItem('u2k')){$('#gate').style.display='none';$('#app').style.display='block';render()}}catch(e){}
function go(i){tab=i;render();scrollTo({top:0,behavior:'smooth'})}
function render(){
const d=document.documentElement;d.lang=lang;d.dir=lang==='ar'?'rtl':'ltr';
$('#gp').textContent=s('pass');$('#gbn').textContent=s('go');
$('#brand').textContent='م/ أحمد تامر · '+s('brand');$('#lg').textContent=s('lang');
$('#hp').textContent=s('hp');$('#ht').innerHTML=s('ht');$('#hs').textContent=s('hs');$('#ft').textContent=s('ft');
hud();
const tot=LS.reduce((a,l)=>a+l.terms.length,0);$('#bar').style.width=Math.min(100,Object.keys(done).length/tot*100)+'%';
$('#tabs').innerHTML=LS.map((l,i)=>`<button class="tab ${tab===i?'on':''}" onclick="go(${i})">${l.ic} ${t(l.n).split(':')[0]}</button>`).join('')+`<button class="tab ${tab===3?'on':''}" onclick="go(3)">${s('chal')}</button><button class="tab ${tab===4?'on':''}" onclick="go(4)">${s('quiz')}</button>`;
$('#main').innerHTML=tab<3?lesson(tab):tab===3?chal():quiz();}
function lesson(i){const l=LS[i];return `<h2 class="lt">${l.ic} ${t(l.n)}</h2><h3>${s('key')}</h3><div class="card">${l.pts.map((p,k)=>`<div class="pt"><i>${k+1}</i><span>${t(p)}</span></div>`).join('')}</div>
<h3>${s('terms')}</h3><div class="grid">${l.terms.map((m,j)=>`<div class="tm ${done[i+'_'+j]?'done':miss[i+'_'+j]?'miss':''}"><div class="h"><span class="ic">${m.ic}</span><b>${t(m.n)}</b></div><p>${t(m.d)}</p><button class="btn sm" onclick="play(${i},${j})">${done[i+'_'+j]?'✅':s('play')}</button><div class="gm" id="g${i}_${j}"></div></div>`).join('')}</div>
<div class="tip">💡 ${t(l.tip)}</div><div class="nx"><button class="btn" onclick="go(${i+1})">${i<2?s('next'):s('chal')}</button></div>`}
function play(i,j){const m=LS[i].terms[j],e=$('#g'+i+'_'+j);if(e.classList.toggle('open')){tries[i+'_'+j]=0;e.innerHTML=`<div class="q">${t(m.q)}</div><div class="os">${shuf(m.o.map((_,k)=>k)).map(k=>`<button class="o" onclick="ans(${i},${j},${k},this)">${t(m.o[k])}</button>`).join('')}</div><div class="fb"></div><div class="exw"></div>`}}
function ans(i,j,k,b){const m=LS[i].terms[j],g=b.closest('.gm'),f=g.querySelector('.fb'),x=g.querySelector('.exw'),id=i+'_'+j,bs=[...g.querySelectorAll('.o')],tx=t(m.o[m.a]);
if(k===m.a){b.classList.add('ok');bs.forEach(o=>o.disabled=true);f.style.color='var(--ok)';
if(!tries[id]){const bo=done[id]?0:reward(true);f.textContent='✅ '+t(['برافو!','Great!'])+(bo?' 🔥+'+bo:'')+(done[id]?'':' +10')}else{f.textContent='✅ '+t(['صح — دلوقتي فاهمها','Correct — now you get it']);xp+=5;stk=0;hud();save()}
done[id]=1;delete miss[id];b.closest('.tm').classList.add('done');x.innerHTML=`<div class="ex">📖 <b>${t(m.n)}</b>: ${t(m.d)}</div>`;save()}
else{tries[id]=(tries[id]||0)+1;b.classList.add('bad');b.disabled=true;stk=0;hud();f.style.color='var(--bad)';
if(tries[id]<2){f.textContent='❌ '+t(['مش دي — اقرا التلميح وجرّب تاني','Not that one — read the hint, try again']);x.innerHTML=`<div class="ex no">💡 ${t(m.d)}</div>`}
else{f.textContent='❌ '+t(['الصح متعلّم بالأخضر — ركّز في الشرح','The correct one is in green — read why']);bs.forEach(o=>{o.disabled=true;if(o.textContent===tx)o.classList.add('ok')});miss[id]=1;save();b.closest('.tm').classList.add('miss');x.innerHTML=`<div class="ex no">📖 <b>${t(m.n)}</b>: ${t(m.d)}</div>`}}}
function chal(){const n=CS.length,H=`<h2 class="lt">${s('chal')}</h2>`;
if(cs>=n)return H+`<div class="res">🎉 ${s('score')}: ${cn} ${s('of')} ${n}<br><small>${t([cn>=n-1?'أنت فاهم الوحدة 👏':cn>=n/2?'كويس — راجع الحالات اللي غلطت فيها':'ارجع للدروس واقرا التلميحات وجرّب تاني','You really get this unit 👏'])}</small></div><div class="nx"><button class="btn" onclick="cs=0;cn=0;ca=void 0;render()">🔁 ${t(['العب تاني','Play again'])}</button> <button class="btn" onclick="go(4)">${s('quiz')}</button></div>`;
const c=CS[cs],d=ca!==void 0;
return H+`<p style="color:var(--dim);margin:0">${t(['حالات من الحياة الواقعية — اختار، وبعدين اقرا ليه.','Real-life cases — choose, then read why.'])}</p><div class="cs"><div class="meta"><span>${cs+1} / ${n}</span><span style="font-size:22px">${c.ic}</span></div><div class="pb"><i style="width:${cs/n*100}%"></i></div><div class="sc">${t(c.q)}</div><div class="os">${c.o.map((o,k)=>`<button class="o ${d?(k===c.a?'ok':ca===k?'bad':''):''}" ${d?'disabled':''} onclick="cpick(${k})">${t(o)}</button>`).join('')}</div>${d?`<div class="ex ${ca===c.a?'':'no'}">${ca===c.a?'✅ ':'❌ '}${t(c.x)}</div><div class="nx"><button class="btn" onclick="cs++;ca=void 0;render()">${cs<n-1?t(['الحالة التالية ←','Next case →']):t(['النتيجة','Result'])}</button></div>`:''}</div>`}
function cpick(k){ca=k;if(k===CS[cs].a)cn++;reward(k===CS[cs].a);render()}
function quiz(){const n=Object.keys(qa).length,sc=QZ.filter((q,i)=>qa[i]===q.a).length;
return `<h2 class="lt">${s('quiz')}</h2>`+QZ.map((q,i)=>{const d=qa[i]!==undefined;return `<div class="mq"><div class="q">${i+1}. ${t(q.q)}</div><div class="os">${q.o.map((o,k)=>`<button class="o ${d?(k===q.a?'ok':qa[i]===k?'bad':''):''}" ${d?'disabled':''} onclick="pick(${i},${k})">${t(o)}</button>`).join('')}</div>${d?`<div class="ex ${qa[i]===q.a?'':'no'}">${qa[i]===q.a?'✅ ':'❌ '}${t(QX[i])}</div>`:''}</div>`}).join('')+(n===QZ.length?`<div class="res">🎉 ${s('score')}: ${sc} ${s('of')} ${QZ.length}</div><div class="nx"><button class="btn" onclick="qa={};render()">🔁 ${t(['إعادة الاختبار','Retry'])}</button></div>`:'<div class="nx"></div>')}
function pick(i,k){if(qa[i]!==undefined)return;qa[i]=k;reward(k===QZ[i].a);render()}
</script>
</body>
</html>
